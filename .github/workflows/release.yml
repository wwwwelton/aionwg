name: build-and-release

on:
  push:
    branches: [main]

# One release at a time so version numbers never collide.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Record certificate fingerprint
        run: sha256sum internal/tlscert/cert.pem > "$RUNNER_TEMP/cert.sha256"
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip
      - name: Native regression check
        run: cc -std=c11 -Wall -Wextra -Werror native/shugo-compat-test.c -o /tmp/shugo-check && /tmp/shugo-check
      - name: Build embedded EXE
        run: ./build-embedded.sh
      - name: Verify certificate unchanged
        run: sha256sum -c "$RUNNER_TEMP/cert.sha256"
      - name: Sign EXE with release certificate
        env:
          AIONWG_PFX_B64: ${{ secrets.AIONWG_PFX_B64 }}
          AIONWG_PFX_PW: ${{ secrets.AIONWG_PFX_PW }}
        run: |
          set -euo pipefail
          [ -n "$AIONWG_PFX_B64" ] && [ -n "$AIONWG_PFX_PW" ] || { echo "::error::AIONWG_PFX_B64 and AIONWG_PFX_PW secrets are required"; exit 1; }
          sudo apt-get install -y osslsigncode
          pfx="$RUNNER_TEMP/sign.pfx"
          printf '%s' "$AIONWG_PFX_B64" | base64 -d > "$pfx"
          osslsigncode sign -pkcs12 "$pfx" -pass "$AIONWG_PFX_PW" -h sha256 \
            -in dist/standalone/AionWG.exe -out dist/standalone/AionWG-signed.exe
          mv -f dist/standalone/AionWG-signed.exe dist/standalone/AionWG.exe
          rm -f "$pfx"
      - name: Repack zip with signed EXE
        run: |
          set -euo pipefail
          rm -f dist/AionWG-standalone-windows-x64.zip
          (cd dist/standalone && zip -q ../AionWG-standalone-windows-x64.zip AionWG.exe WinDivert-LICENSE.txt WireGuard-go-LICENSE.txt)
      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then next=v1.0.0; else
            IFS=. read -r major minor patch <<<"${last#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cp dist/standalone/AionWG.exe "AionWG-${TAG}-windows-x64.exe"
          cp dist/AionWG-standalone-windows-x64.zip "AionWG-${TAG}-windows-x64.zip"
          sha256sum "AionWG-${TAG}-windows-x64".* > SHA256SUMS.txt
          gh release create "$TAG" --target "$GITHUB_SHA" --title "AionWG $TAG" \
            --generate-notes "AionWG-${TAG}-windows-x64.exe" "AionWG-${TAG}-windows-x64.zip" SHA256SUMS.txt
